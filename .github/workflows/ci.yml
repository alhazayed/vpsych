name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Migration parity
        run: npm run test:migrations
        env:
          # Optional: set SUPABASE_DB_URL in repo secrets to also compare
          # remote supabase_migrations.schema_migrations against git.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Performance smoke (local budgets)
        run: npm run test:perf-smoke

      - name: Build
        run: npm run build
        env:
          # Public client keys are read at runtime; provide placeholders so the
          # production build never fails on a missing-env check in CI.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
