name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Align with Vercel project Node runtime (24.x).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (High+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Migration parity
        run: npm run test:migrations
        env:
          # Optional: set SUPABASE_DB_URL in repo secrets to also compare
          # remote supabase_migrations.schema_migrations against git.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Build
        run: npm run build
        env:
          # Public client keys are read at runtime; provide placeholders so the
          # production build never fails on a missing-env check in CI.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://example.com

      - name: Failure injection — smoke requires SMOKE_BASE_URL
        run: |
          if node scripts/smoke-prod.mjs; then
            echo "expected non-zero exit without SMOKE_BASE_URL" >&2
            exit 1
          fi
