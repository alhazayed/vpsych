name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject tracked environment files
        run: node scripts/check-tracked-env-files.mjs

      - name: Dependency audit
        run: npm run audit:deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Migration parity
        run: npm run test:migrations
        env:
          # Configure SUPABASE_DB_URL to compare the deployed schema. The
          # script reports a clear warning until the remote check is enabled.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Performance smoke (local budgets)
        run: npm run test:perf-smoke

      - name: Build
        run: npm run build
        env:
          # Public client keys are read at runtime; provide placeholders so the
          # production build never fails on a missing-env check in CI.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  database-rules:
    # Rebuilds the schema from every migration on a throwaway local Supabase
    # database and checks who can read and write what. No secrets; never
    # touches a real project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Database security rules
        run: npm run test:db-rls

  e2e:
    # Signs in, runs a typed Therapy Room session, ends it, and checks the
    # admin-only report, against a throwaway local Supabase stack. No secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
